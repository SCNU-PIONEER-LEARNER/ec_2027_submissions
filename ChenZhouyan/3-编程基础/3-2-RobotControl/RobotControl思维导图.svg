<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 615" width="100%" role="img">
<title>RobotControl 机器人路径决策思维导图</title>
<desc>RobotControl 代码结构思维导图：枚举、类成员、决策逻辑与执行循环</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="220" y="28" width="240" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">RobotControl 机器人路径决策</text>
<path d="M340,72 C340,84 140,84 140,96" fill="none" stroke="#1D9E75" stroke-width="1"/>
<path d="M340,72 L340,96" fill="none" stroke="#7F77DD" stroke-width="1"/>
<path d="M340,72 C340,84 525,84 525,96" fill="none" stroke="#BA7517" stroke-width="1"/>
<rect x="40" y="96" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">枚举 Action</text>
<text x="140" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">前进 · 左转 · 右转 · 后退</text>
<rect x="255" y="96" width="170" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">class Robot</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">封装路径选择决策</text>
<rect x="410" y="96" width="230" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="525" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">main() 主循环</text>
<text x="525" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">循环执行 getData → update</text>
<path d="M340,152 C340,170 160,168 160,186" fill="none" stroke="#D4537E" stroke-width="1"/>
<path d="M340,152 C340,170 520,168 520,186" fill="none" stroke="#639922" stroke-width="1"/>
<path d="M340,152 L340,300" fill="none" stroke="#D85A30" stroke-width="1"/>
<rect x="40" y="186" width="240" height="104" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="160" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">private 私有成员</text>
<text x="160" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">left / front / right（三向距离）</text>
<text x="160" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">canForward = (front &gt; 30)</text>
<text x="160" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">isNarrow = 左&lt;15 或 右&lt;15</text>
<rect x="400" y="186" width="240" height="104" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="520" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">public 成员函数</text>
<text x="520" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">构造函数（左,前,右初始距离）</text>
<text x="520" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">getData → decide → update</text>
<text x="520" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">前进 / 左转 / 右转 / 后退 4个动作</text>
<rect x="230" y="300" width="220" height="52" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="319" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">decide() 决策核心</text>
<text x="340" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">依据距离给 action 赋值</text>
<path d="M340,352 C340,372 130,372 130,392" fill="none" stroke="#639922" stroke-width="1"/>
<path d="M340,352 L340,392" fill="none" stroke="#BA7517" stroke-width="1"/>
<path d="M340,352 C340,372 545,372 545,392" fill="none" stroke="#A32D2D" stroke-width="1"/>
<rect x="40" y="392" width="180" height="84" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="130" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">① 能前进？</text>
<text x="130" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">front &gt; 30</text>
<text x="130" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">→ action = Forward</text>
<rect x="230" y="392" width="220" height="84" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">② 不能前进 → 比较左右</text>
<text x="340" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">左&gt;右→Left   右&gt;左→Right</text>
<text x="340" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">左右相等 → Backward</text>
<rect x="455" y="392" width="180" height="84" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="545" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F">③ 狭窄？（最高优先）</text>
<text x="545" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">左&lt;15 或 右&lt;15</text>
<text x="545" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">→ 强制 Backward</text>
<path d="M130,476 C130,494 260,494 265,508" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M340,476 L340,508" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M545,476 C545,494 420,494 415,508" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="210" y="508" width="260" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="527" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">update() 执行动作</text>
<text x="340" y="547" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">switch(action) 调用对应函数</text>
<text x="340" y="586" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">主循环每帧：getData 取距离 → decide 决策 → update 执行，循环往复</text>
</svg>
