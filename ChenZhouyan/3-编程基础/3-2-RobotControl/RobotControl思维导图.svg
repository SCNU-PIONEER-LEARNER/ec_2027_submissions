<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 615" width="100%" role="img">
<title>RobotControl 机器人路径决策思维导图</title>
<desc>RobotControl 代码结构思维导图：枚举、类成员、决策逻辑与执行循环</desc>
<defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
</filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="615" fill="#FFFFFF"/>

<g filter="url(#rough)" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<rect x="220" y="28" width="240" height="44" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(-0.6 340 50)"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">RobotControl 机器人路径决策</text>
<path d="M340,72 C340,84 140,84 140,96" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,72 L340,96" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,72 C340,84 525,84 525,96" fill="none" stroke="#000" stroke-width="1"/>
<rect x="40" y="96" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.5 140 124)"/>
<text x="140" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">枚举 Action</text>
<text x="140" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">前进 · 左转 · 右转 · 后退</text>
<rect x="255" y="96" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(-0.4 340 124)"/>
<text x="340" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">class Robot</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">封装路径选择决策</text>
<rect x="410" y="96" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.6 525 124)"/>
<text x="525" y="117" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">main() 主循环</text>
<text x="525" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">循环执行 getData → update</text>
<path d="M340,152 C340,170 160,168 160,186" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,152 C340,170 520,168 520,186" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,152 L340,300" fill="none" stroke="#000" stroke-width="1"/>
<rect x="40" y="186" width="240" height="104" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.4 160 238)"/>
<text x="160" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">private 私有成员</text>
<text x="160" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">left / front / right（三向距离）</text>
<text x="160" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">canForward = (front &gt; 30)</text>
<text x="160" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">isNarrow = 左&lt;15 或 右&lt;15</text>
<rect x="400" y="186" width="240" height="104" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(-0.5 520 238)"/>
<text x="520" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">public 成员函数</text>
<text x="520" y="228" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">构造函数（左,前,右初始距离）</text>
<text x="520" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">getData → decide → update</text>
<text x="520" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">前进 / 左转 / 右转 / 后退 4个动作</text>
<rect x="230" y="300" width="220" height="52" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.3 340 326)"/>
<text x="340" y="319" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">decide() 决策核心</text>
<text x="340" y="339" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">依据距离给 action 赋值</text>
<path d="M340,352 C340,372 130,372 130,392" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,352 L340,392" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,352 C340,372 545,372 545,392" fill="none" stroke="#000" stroke-width="1"/>
<rect x="40" y="392" width="180" height="84" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(-0.5 130 434)"/>
<text x="130" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#000">① 能前进？</text>
<text x="130" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">front &gt; 30</text>
<text x="130" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">→ action = Forward</text>
<rect x="230" y="392" width="220" height="84" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.4 340 434)"/>
<text x="340" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#000">② 不能前进 → 比较左右</text>
<text x="340" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">左&gt;右→Left   右&gt;左→Right</text>
<text x="340" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">左右相等 → Backward</text>
<rect x="455" y="392" width="180" height="84" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(0.5 545 434)"/>
<text x="545" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#000">③ 狭窄？（最高优先）</text>
<text x="545" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">左&lt;15 或 右&lt;15</text>
<text x="545" y="454" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">→ 强制 Backward</text>
<path d="M130,476 C130,494 260,494 265,508" fill="none" stroke="#000" stroke-width="1"/>
<path d="M340,476 L340,508" fill="none" stroke="#000" stroke-width="1"/>
<path d="M545,476 C545,494 420,494 415,508" fill="none" stroke="#000" stroke-width="1"/>
<rect x="210" y="508" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#000" stroke-width="1" transform="rotate(-0.3 340 534)"/>
<text x="340" y="527" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#000">update() 执行动作</text>
<text x="340" y="547" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#000">switch(action) 调用对应函数</text>
<text x="340" y="586" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444">主循环每帧：getData 取距离 → decide 决策 → update 执行，循环往复</text>
</g>
</svg>
