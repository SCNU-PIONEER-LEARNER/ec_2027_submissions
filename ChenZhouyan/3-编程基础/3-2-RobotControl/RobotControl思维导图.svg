<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 645" width="100%" role="img">
<title>RobotControl 机器人路径决策思维导图（手绘版）</title>
<desc>手写风格思维导图：枚举、类成员、决策逻辑与执行循环</desc>
<defs>
<filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="turbulence" baseFrequency="0.016" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#4a4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="700" height="645" fill="#FCFBF4"/>
<!-- 几处淡淡的铅笔/纸面瑕疵 -->
<circle cx="64" cy="120" r="2.2" fill="#c9c4b4" opacity="0.5"/>
<path d="M612 540 q14 -8 26 4" fill="none" stroke="#d8d2c0" stroke-width="1.5" opacity="0.6"/>
<path d="M86 470 l10 3 -8 6" fill="none" stroke="#cfc9b6" stroke-width="1.4" opacity="0.55"/>

<g filter="url(#rough)" font-family="'Comic Sans MS','Segoe Print','Bradley Hand','Xingkai SC','STXingkai','cursive'" fill="#3a3a34">

  <!-- 中心标题 -->
  <rect x="216" y="30" width="252" height="46" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" transform="rotate(-1.4 342 53)"/>
  <text x="342" y="55" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C" transform="rotate(-1.4 342 53)">RobotControl 机器人路径决策</text>

  <!-- 第一层三连线 -->
  <path d="M345,77 C350,92 150,86 150,99" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M344,77 C342,92 338,87 340,95" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M340,77 C335,93 528,90 528,101" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 枚举 Action -->
  <rect x="34" y="99" width="208" height="58" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4" transform="rotate(1.1 138 128)"/>
  <text x="140" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">枚举 Action</text>
  <text x="140" y="141" text-anchor="middle" font-size="12.5" fill="#0F6E56">前进 · 左转 · 右转 · 后退</text>

  <!-- class Robot -->
  <rect x="251" y="95" width="176" height="60" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" transform="rotate(-0.9 339 125)"/>
  <text x="340" y="117" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">class Robot</text>
  <text x="340" y="138" text-anchor="middle" font-size="12.5" fill="#534AB7">封装路径选择决策</text>

  <!-- main 主循环 -->
  <rect x="416" y="101" width="232" height="56" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4" transform="rotate(1.3 532 129)"/>
  <text x="532" y="121" text-anchor="middle" font-size="15" font-weight="600" fill="#633806">main() 主循环</text>
  <text x="532" y="142" text-anchor="middle" font-size="12.5" fill="#854F0B">循环 getData → update</text>

  <!-- 第二层三连线 -->
  <path d="M340,156 C342,174 160,170 161,189" fill="none" stroke="#D4537E" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M340,156 C338,173 522,171 521,187" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M340,156 C341,178 339,300 340,301" fill="none" stroke="#D85A30" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- private 私有成员 -->
  <rect x="33" y="189" width="246" height="112" rx="9" fill="#FBEAF0" stroke="#993556" stroke-width="1.4" transform="rotate(-1.2 156 245)"/>
  <text x="158" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#72243E">private 私有成员</text>
  <text x="158" y="232" text-anchor="middle" font-size="12.5" fill="#993556">left / front / right（三向距离）</text>
  <text x="158" y="254" text-anchor="middle" font-size="12.5" fill="#993556">canForward = (front &gt; 30)</text>
  <text x="158" y="276" text-anchor="middle" font-size="12.5" fill="#993556">isNarrow = 左&lt;15 或 右&lt;15</text>

  <!-- public 成员函数 -->
  <rect x="401" y="185" width="246" height="114" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4" transform="rotate(1.4 524 242)"/>
  <text x="525" y="207" text-anchor="middle" font-size="15" font-weight="600" fill="#27500A">public 成员函数</text>
  <text x="525" y="229" text-anchor="middle" font-size="12.5" fill="#3B6D11">构造函数（左,前,右初始距离）</text>
  <text x="525" y="251" text-anchor="middle" font-size="12.5" fill="#3B6D11">getData → decide → update</text>
  <text x="525" y="273" text-anchor="middle" font-size="12.5" fill="#3B6D11">前进/左转/右转/后退 4个动作</text>

  <!-- decide 决策核心 -->
  <rect x="222" y="301" width="232" height="54" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4" transform="rotate(-0.7 338 328)"/>
  <text x="340" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">decide() 决策核心</text>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" fill="#993C1D">依据距离给 action 赋值</text>

  <!-- 第三层三连线 -->
  <path d="M340,356 C338,374 130,372 131,393" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M340,356 C341,374 339,392 340,393" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M342,356 C344,374 546,373 545,393" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ① 能前进 -->
  <rect x="34" y="393" width="188" height="90" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4" transform="rotate(1.6 128 438)"/>
  <text x="129" y="415" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">① 能前进？</text>
  <text x="129" y="437" text-anchor="middle" font-size="12.5" fill="#3B6D11">front &gt; 30</text>
  <text x="129" y="459" text-anchor="middle" font-size="12.5" fill="#3B6D11">→ action = Forward</text>

  <!-- ② 比较左右 -->
  <rect x="229" y="397" width="226" height="88" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4" transform="rotate(-0.9 342 441)"/>
  <text x="342" y="419" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">② 不能前进 → 比左右</text>
  <text x="342" y="441" text-anchor="middle" font-size="12.5" fill="#854F0B">左&gt;右→Left  右&gt;左→Right</text>
  <text x="342" y="463" text-anchor="middle" font-size="12.5" fill="#854F0B">相等 → Backward</text>

  <!-- ③ 狭窄 -->
  <rect x="459" y="391" width="189" height="92" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4" transform="rotate(1.1 553 437)"/>
  <text x="554" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#791F1F">③ 狭窄？（最优先）</text>
  <text x="554" y="435" text-anchor="middle" font-size="12.5" fill="#A32D2D">左&lt;15 或 右&lt;15</text>
  <text x="554" y="457" text-anchor="middle" font-size="12.5" fill="#A32D2D">→ 强制 Backward</text>

  <!-- 汇聚连线 -->
  <path d="M131,484 C128,503 262,500 268,512" fill="none" stroke="#7a7a70" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M342,486 L342,513" fill="none" stroke="#7a7a70" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M546,484 C549,503 422,500 416,512" fill="none" stroke="#7a7a70" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- update 执行 -->
  <rect x="206" y="513" width="266" height="54" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4" transform="rotate(-1.3 339 540)"/>
  <text x="340" y="532" text-anchor="middle" font-size="15" font-weight="600" fill="#0C447C">update() 执行动作</text>
  <text x="340" y="552" text-anchor="middle" font-size="12.5" fill="#185FA5">switch(action) 调对应函数</text>

  <text x="344" y="592" text-anchor="middle" font-size="12.5" fill="#5F5E5A">主循环每帧：getData 取距离 → decide 决策 → update 执行，循环往复</text>
</g>
</svg>
